<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineShelf – Meine Medienbibliothek</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVIGATION -->
<nav id="navbar">
  <div class="nav-inner">
    <a href="#" class="logo" onclick="showPage('home')">
      <span class="logo-mark">⬡</span>
      <span class="logo-text">CineShelf</span>
    </a>
    <div class="nav-links">
      <a href="#" onclick="showPage('home')" data-page="home" class="nav-link active">Bibliothek</a>
      <a href="#" onclick="showPage('toprated')" data-page="toprated" class="nav-link">Top Rated</a>
      <a href="#" onclick="showPage('favorites')" data-page="favorites" class="nav-link">Favoriten</a>
      <a href="#" onclick="showPage('stats')" data-page="stats" class="nav-link">Statistiken</a>
    </div>
    <div class="nav-actions">
      <button class="btn-random" onclick="openRandom()" title="Zufälliger Eintrag">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m19 15 3 3-3 3"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 6h-5.9c-1.3 0-2.5.6-3.3 1.7l-.5.8"/><path d="m19 3 3 3-3 3"/></svg>
        <span>Zufällig</span>
      </button>
      <button class="btn-lang" onclick="toggleLang()" id="langBtn">EN</button>
    </div>
  </div>
</nav>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Titel, Regisseur, Schauspieler …" oninput="applyFilters()">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">×</button>
    </div>
    <div class="filter-row">
      <select id="filterType" onchange="applyFilters()" class="filter-select">
        <option value="">Alle Typen</option>
        <option value="film">Filme</option>
        <option value="wwe">WWE</option>
        <option value="concert">Konzerte</option>
      </select>
      <select id="filterGenre" onchange="applyFilters()" class="filter-select">
        <option value="">Alle Genres</option>
      </select>
      <select id="filterDecade" onchange="applyFilters()" class="filter-select">
        <option value="">Alle Jahre</option>
      </select>
      <select id="filterCountry" onchange="applyFilters()" class="filter-select">
        <option value="">Alle Länder</option>
      </select>
      <label class="filter-check">
        <input type="checkbox" id="filterFav" onchange="applyFilters()">
        <span>Nur Favoriten</span>
      </label>
      <select id="sortBy" onchange="applyFilters()" class="filter-select">
        <option value="added-desc">Zuletzt hinzugefügt</option>
        <option value="title-asc">Titel A–Z</option>
        <option value="title-desc">Titel Z–A</option>
        <option value="year-desc">Jahr ↓</option>
        <option value="year-asc">Jahr ↑</option>
        <option value="rating-desc">Bewertung ↓</option>
      </select>
    </div>
  </div>
  <div id="resultsCount" class="results-count"></div>
  <div id="grid" class="poster-grid"></div>
  <div id="loadMore" class="load-more-wrap" style="display:none">
    <button onclick="loadMoreItems()" class="btn-loadmore">Mehr laden</button>
  </div>
</div>

<!-- TOP RATED PAGE -->
<div id="page-toprated" class="page">
  <div class="page-header">
    <h1 class="page-title">Top Rated</h1>
    <p class="page-subtitle" id="topratedSubtitle">Einträge mit der höchsten Bewertung</p>
  </div>
  <div id="toprated-grid" class="poster-grid"></div>
</div>

<!-- FAVORITES PAGE -->
<div id="page-favorites" class="page">
  <div class="page-header">
    <h1 class="page-title">Favoriten</h1>
    <p class="page-subtitle" id="favoritesSubtitle">Deine markierten Lieblinge</p>
  </div>
  <div id="favorites-grid" class="poster-grid"></div>
  <div id="favorites-empty" class="empty-state" style="display:none">
    <div class="empty-icon">♡</div>
    <p>Noch keine Favoriten markiert.</p>
    <p class="empty-sub">Klicke das Herz-Symbol auf einer Karte, um sie hier zu speichern.</p>
  </div>
</div>

<!-- STATS PAGE -->
<div id="page-stats" class="page">
  <div class="page-header">
    <h1 class="page-title">Statistiken</h1>
    <p class="page-subtitle">Ein Blick in deine Sammlung</p>
  </div>
  <div id="stats-content" class="stats-grid"></div>
</div>

<!-- DETAIL MODAL -->
<div id="modal" class="modal" onclick="closeModal(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModalBtn()">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
